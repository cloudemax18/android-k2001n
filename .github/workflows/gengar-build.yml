name: Build Phantom Companions APK
on:
  push:
    branches: [gengar-floating-companion]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Prepare animation resources
        run: mkdir -p app/src/main/res/raw
      - name: Build debug APK
        run: |
          gradle --no-daemon assembleDebug
          cp app/build/outputs/apk/debug/app-debug.apk app/build/outputs/apk/debug/Phantom-Companions.apk
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Phantom-Companions
          path: app/build/outputs/apk/debug/Phantom-Companions.apk
          if-no-files-found: error
