name: Build floating avatars APK

on:
  workflow_dispatch:
  pull_request:
    branches: [ "main" ]
  push:
    branches: [ "main", "feat/floating-avatars" ]
    paths:
      - "**.gradle"
      - "**.gradle.kts"
      - "app/**"
      - ".github/workflows/build-apk.yml"
      - "gradle.properties"
      - "assets/sprites_base64/**"
      - "settings.gradle.kts"

permissions:
  contents: read

jobs:
  build:
    name: Compile debug APK
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"
      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
          accept-android-sdk-licenses: true
      - name: Install Android SDK packages
        run: sdkmanager "platforms;android-35" "build-tools;35.0.0"
      - name: Restore transparent avatar images
        run: |
          mkdir -p app/src/main/res/drawable-nodpi
          base64 --decode assets/sprites_base64/reaper_main.webp.b64 > app/src/main/res/drawable-nodpi/reaper_main.webp
          base64 --decode assets/sprites_base64/ghost_main.webp.b64 > app/src/main/res/drawable-nodpi/ghost_main.webp
          file app/src/main/res/drawable-nodpi/*.webp
      - name: Build debug APK
        run: gradle --no-daemon assembleDebug
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: floating-avatars-debug-apk
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 14
